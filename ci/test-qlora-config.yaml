# CI smoke-test QLoRA config — 100 iters only (~1-2 min).
# Adapter saved to ci/adapters/qlora/ to avoid touching production adapters.
# Run via: make test-train-qlora

model: "./models/tinyllama-4bit-base"
fine_tune_type: lora
train: true
data: "./ci/data"
seed: 0
lora_layers: 4        # fewer layers → faster
batch_size: 1
iters: 100
val_batches: 5
learning_rate: 1e-4
steps_per_report: 10
steps_per_eval: 50
adapter_path: "./ci/adapters/qlora"
save_every: 100
test: false
max_seq_length: 256
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  scale: 2.0
  dropout: 0.0
