# CI smoke-test Full FT config — 100 iters only (~3-5 min).
# Adapter saved to ci/adapters/full/ to avoid touching production adapters.
# Run via: make test-train-full

model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
fine_tune_type: full
train: true
data: "./ci/data"
seed: 0
batch_size: 1
grad_accumulation_steps: 4
iters: 100
val_batches: 5
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 50
adapter_path: "./ci/adapters/full"
save_every: 100
test: false
max_seq_length: 256
grad_checkpoint: true
mask_prompt: true
