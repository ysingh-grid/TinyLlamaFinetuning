# LoRA Rank 8 Experiment
model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
train: true
data: "./data"
seed: 0
lora_layers: 16
batch_size: 1
iters: 4000 # Shorter for experiments
val_batches: 25
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 200
resume_adapter_file: null
adapter_path: "./adapters/rank8_experiment"
save_every: 1000 # Save only at end
test: false
test_batches: 100
max_seq_length: 512
grad_checkpoint: true
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  scale: 2.0
  dropout: 0.05
